[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hspd"
version = "1.0.0"
description = "Hessian Subspace Power Distillation: recovering shallow neural networks from their Hessians"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "scikit-learn>=1.5",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
